<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時視訊導播系統 (Webcam Director)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 1.25rem; font-weight: 600; color: var(--accent); }
    .status {
      font-size: 0.875rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background-color: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 1.5rem;
      padding: 1.5rem;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }
    @media(max-width: 1024px) {
      main { grid-template-columns: 1fr; }
    }
    .stage-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .stage {
      flex: 1;
      background-color: #000;
      position: relative;
      min-height: 450px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stage video, .stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .controls-panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    label { font-size: 0.875rem; color: var(--text-muted); font-weight: 500; }
    select, button {
      padding: 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      font-size: 0.875rem;
      outline: none;
      transition: all 0.2s;
    }
    select:focus { border-color: var(--accent); }
    button {
      background-color: var(--accent);
      color: #000;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    button:hover { background-color: var(--accent-hover); }
    .hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <header>
    <h1>Webcam Director (原生長寬比自動適應版)</h1>
    <div id="connectionStatus" class="status">就緒</div>
  </header>

  <main>
    <div class="stage-container">
      <div class="stage" id="stage">
        <!-- 視訊畫面或畫布將在此處呈現 -->
        <video id="previewVideo" autoplay playsinline muted></video>
      </div>
    </div>

    <div class="controls-panel">
      <div class="control-group">
        <label for="cameraSelect">選擇相機設備</label>
        <select id="cameraSelect"></select>
      </div>
      <div class="control-group">
        <label for="aspectMode">畫面比例模式</label>
        <select id="aspectMode">
          <option value="native">原生相機比例 (不強制裁切)</option>
          <option value="169">強制 16:9</option>
        </select>
      </div>
      <button id="toggleBtn">啟動相機</button>
      <div class="hint">
        <b>提示：</b> 此版本支援手機直立與橫向拍攝之自動適應。直式畫面將以直式完整顯示，橫式則以橫式完整顯示，不會再被強行切成硬性的橫向框。
      </div>
    </div>
  </main>

  <script>
    const videoElement = document.getElementById('previewVideo');
    const cameraSelect = document.getElementById('cameraSelect');
    const toggleBtn = document.getElementById('toggleBtn');
    const statusDiv = document.getElementById('connectionStatus');
    const aspectModeSelect = document.getElementById('aspectMode');

    let localStream = null;
    let isRunning = false;

    // 取得可用的相機列表
    async function getCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');
        cameraSelect.innerHTML = '';
        videoDevices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.label = device.label || `相機 ${index + 1}`;
          cameraSelect.appendChild(option);
        });
      } catch (err) {
        console.error('無法取得相機列表:', err);
      }
    }

    // 啟動相機
    async function startCamera() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }

      const deviceId = cameraSelect.value;
      const mode = aspectModeSelect.value;

      let constraints = {
        video: {
          deviceId: deviceId ? { exact: deviceId } : undefined
        },
        audio: true
      };

      if (mode === '169') {
        constraints.video.width = { ideal: 1280 };
        constraints.video.height = { ideal: 720 };
      } else {
        // 原生高清嘗試，允許相機以最高自由度回報真實尺寸
        constraints.video.width = { ideal: 1920 };
        constraints.video.height = { ideal: 1080 };
      }

      try {
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = localStream;
        
        videoElement.onloadedmetadata = () => {
          console.log(`相機實際解析度: ${videoElement.videoWidth} x ${videoElement.videoHeight}`);
          statusDiv.textContent = `運作中 (${videoElement.videoWidth}x${videoElement.videoHeight})`;
          statusDiv.style.backgroundColor = 'rgba(52, 211, 153, 0.1)';
          statusDiv.style.color = '#34d399';
          statusDiv.style.borderColor = 'rgba(52, 211, 153, 0.2)';
        };

        toggleBtn.textContent = '關閉相機';
        isRunning = true;
      } catch (err) {
        console.error('無法啟動相機:', err);
        alert('無法啟動相機，請檢查權限或裝置是否被佔用。');
      }
    }

    // 關閉相機
    function stopCamera() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      videoElement.srcObject = null;
      statusDiv.textContent = '已停止';
      statusDiv.style.backgroundColor = 'rgba(56, 189, 248, 0.1)';
      statusDiv.style.color = 'var(--accent)';
      statusDiv.style.borderColor = 'rgba(56, 189, 248, 0.2)';
      toggleBtn.textContent = '啟動相機';
      isRunning = false;
    }

    toggleBtn.addEventListener('click', () => {
      if (!isRunning) {
        startCamera();
      } else {
        stopCamera();
      }
    });

    aspectModeSelect.addEventListener('change', () => {
      if (isRunning) {
        startCamera(); // 切換模式時重新啟動相機套用設定
      }
    });

    // 初始化
    navigator.mediaDevices.enumerateDevices().then(() => {
      getCameras();
    });
  </script>
</body>
</html>
